name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-fast-tests:
    name: build-and-fast-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The fast tier builds only the projects it tests; this catches a change that breaks only
      # Persistence.Tests or E2E.Tests, which CI does not run.
      - name: Build the whole solution
        shell: pwsh
        run: dotnet build NoofLedger.slnx

      - name: Run fast test tier
        shell: pwsh
        run: pwsh -NoProfile -File run.ps1 test fast
